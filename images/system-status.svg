<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="960" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#0D1117"/><stop offset="0.52" stop-color="#111827"/><stop offset="1" stop-color="#0D1117"/></linearGradient>
    <linearGradient id="accent" x1="250" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#7F00FF"/><stop offset="0.5" stop-color="#00D9FF"/><stop offset="1" stop-color="#00C853"/></linearGradient>
    <filter id="glow" x="-30%" y="-150%" width="160%" height="400%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title { font: 700 22px 'Segoe UI', Arial, sans-serif; fill: #F0F6FC; letter-spacing: 3px; }
      .subtitle { font: 500 12px 'Segoe UI', Arial, sans-serif; fill: #8B949E; letter-spacing: 1.5px; }
      .label { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #C9D1D9; }
      .percent { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #00D9FF; }
      .status { font: 600 12px 'Segoe UI', Arial, sans-serif; fill: #A78BFA; letter-spacing: 1px; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect x="1" y="1" width="958" height="358" rx="22" fill="url(#panel)" stroke="#30363D" stroke-width="2"/>
  <circle cx="42" cy="38" r="5" fill="#FF5F56"/><circle cx="60" cy="38" r="5" fill="#FFBD2E"/><circle cx="78" cy="38" r="5" fill="#27C93F"/>
  <text x="480" y="46" text-anchor="middle" class="title">SYSTEM STATUS</text>
  <text x="480" y="69" text-anchor="middle" class="subtitle">CONTINUOUS LEARNING · ACTIVE BUILD MODE</text>
  <rect x="60" y="88" width="840" height="1" fill="#30363D"/>
  <g transform="translate(72 112)"><text x="0" y="16" class="label">AI / Machine Learning</text><rect x="235" y="0" width="480" height="18" rx="9" fill="#21262D"/><rect x="235" y="0" height="18" rx="9" fill="url(#accent)" filter="url(#glow)"><animate attributeName="width" from="0" to="422" dur="1.4s" fill="freeze"/></rect><circle cx="657" cy="9" r="4" fill="#00D9FF" class="pulse"/><text x="742" y="15" class="percent">88%</text><text x="795" y="15" class="status">BUILDING</text></g>
  <g transform="translate(72 158)"><text x="0" y="16" class="label">Backend Engineering</text><rect x="235" y="0" width="480" height="18" rx="9" fill="#21262D"/><rect x="235" y="0" height="18" rx="9" fill="url(#accent)" filter="url(#glow)"><animate attributeName="width" from="0" to="394" dur="1.5s" fill="freeze"/></rect><circle cx="629" cy="9" r="4" fill="#00D9FF" class="pulse"/><text x="742" y="15" class="percent">82%</text><text x="795" y="15" class="status">SHIPPING</text></g>
  <g transform="translate(72 204)"><text x="0" y="16" class="label">Data Science</text><rect x="235" y="0" width="480" height="18" rx="9" fill="#21262D"/><rect x="235" y="0" height="18" rx="9" fill="url(#accent)" filter="url(#glow)"><animate attributeName="width" from="0" to="408" dur="1.6s" fill="freeze"/></rect><circle cx="643" cy="9" r="4" fill="#00D9FF" class="pulse"/><text x="742" y="15" class="percent">85%</text><text x="795" y="15" class="status">ANALYZING</text></g>
  <g transform="translate(72 250)"><text x="0" y="16" class="label">Research &amp; Prototyping</text><rect x="235" y="0" width="480" height="18" rx="9" fill="#21262D"/><rect x="235" y="0" height="18" rx="9" fill="url(#accent)" filter="url(#glow)"><animate attributeName="width" from="0" to="365" dur="1.7s" fill="freeze"/></rect><circle cx="600" cy="9" r="4" fill="#00D9FF" class="pulse"/><text x="742" y="15" class="percent">76%</text><text x="795" y="15" class="status">EXPLORING</text></g>
  <g transform="translate(72 296)"><text x="0" y="16" class="label">Open Source</text><rect x="235" y="0" width="480" height="18" rx="9" fill="#21262D"/><rect x="235" y="0" height="18" rx="9" fill="url(#accent)" filter="url(#glow)"><animate attributeName="width" from="0" to="336" dur="1.8s" fill="freeze"/></rect><circle cx="571" cy="9" r="4" fill="#00D9FF" class="pulse"/><text x="742" y="15" class="percent">70%</text><text x="795" y="15" class="status">GROWING</text></g>
  <rect x="60" y="337" width="840" height="2" rx="1" fill="url(#accent)" opacity="0.7"/>
</svg>
